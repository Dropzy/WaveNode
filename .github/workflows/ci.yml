name: Build and test

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify required release files
        run: |
          test -f Backend/go.mod
          test -f Backend/go.sum
          test -f Backend/Dockerfile
          test -f Frontend/package-lock.json
          test -f Frontend/nginx.conf
          test -f Frontend/Dockerfile
          test -f docker-compose.yml
          test -f docker-compose.internet.yml
          test -f Caddyfile

  backend:
    needs: repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.11"
          cache-dependency-path: Backend/go.sum
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...
      - run: go build ./cmd/server

  integration:
    needs: repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: wavenode_test
          POSTGRES_PASSWORD: wavenode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wavenode_test -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    defaults:
      run:
        working-directory: Backend
    env:
      SUBSONIC_TEST_DATABASE_URL: postgres://wavenode_test:wavenode_test@127.0.0.1:5432/postgres?sslmode=disable
      APP_ENV: test
      DEV_SEED_TEST_USER: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.11"
          cache-dependency-path: Backend/go.sum
      - run: go test -tags=integration -count=1 -v ./router

  frontend:
    needs: repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint -- --max-warnings=0
      - run: npm run build

  containers:
    needs: repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p /tmp/wavenode-music
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build
        env:
          POSTGRES_PASSWORD: ci-database-password
          JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
          MUSIC_PATH: /tmp/wavenode-music
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.internet.yml config
        env:
          POSTGRES_PASSWORD: ci-database-password
          JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
          SETUP_TOKEN: ci-setup-token-that-is-long-enough
          MUSIC_PATH: /tmp/wavenode-music
          WAVENODE_DOMAIN: music.example.com
          ACME_EMAIL: admin@example.com
      - run: docker compose --profile updater -f docker-compose.yml -f docker-compose.dev.yml config
        env:
          POSTGRES_PASSWORD: ci-database-password
          JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
          MUSIC_PATH: /tmp/wavenode-music
          WAVENODE_UPDATER_TOKEN: ci-updater-token-that-is-long-enough
      - run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -e WAVENODE_DOMAIN=music.example.com -e ACME_EMAIL=admin@example.com caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
