services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wavenode
      POSTGRES_USER: wavenode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavenode -d wavenode"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${WAVENODE_IMAGE_REGISTRY:-ghcr.io/dropzy/wavenode}/backend:${WAVENODE_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: production
      SERVER_PORT: "8080"
      DATABASE_URL: postgres://wavenode:${POSTGRES_PASSWORD}@database:5432/wavenode?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      WAVENODE_ARTWORK_PATH: /data/artwork
      MUSIC_PATH: ""
      WAVENODE_UPDATE_REPOSITORY: ${WAVENODE_UPDATE_REPOSITORY:-Dropzy/WaveNode}
      WAVENODE_UPDATER_URL: ${WAVENODE_UPDATER_URL:-}
      WAVENODE_UPDATER_TOKEN: ${WAVENODE_UPDATER_TOKEN:-}
      WAVENODE_UPDATE_COMMAND: ${WAVENODE_UPDATE_COMMAND:-}
      WAVENODE_UPDATE_TIMEOUT_SECONDS: ${WAVENODE_UPDATE_TIMEOUT_SECONDS:-900}
    volumes:
      - artwork_data:/data/artwork
      - type: bind
        source: ${MUSIC_PATH:?Set MUSIC_PATH in .env}
        target: /music
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: ${WAVENODE_IMAGE_REGISTRY:-ghcr.io/dropzy/wavenode}/frontend:${WAVENODE_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WAVENODE_BIND_ADDRESS:-127.0.0.1}:${WAVENODE_PORT:-8080}:80"

  updater:
    image: ${WAVENODE_IMAGE_REGISTRY:-ghcr.io/dropzy/wavenode}/updater:${WAVENODE_IMAGE_TAG:-latest}
    restart: unless-stopped
    profiles:
      - updater
    environment:
      WAVENODE_VERSION: ${WAVENODE_VERSION:-0.1.0}
      UPDATER_TOKEN: ${WAVENODE_UPDATER_TOKEN:-}
      UPDATER_COMPOSE_FILES: /compose/docker-compose.yml
      UPDATER_SERVICES: backend,frontend
      UPDATER_TIMEOUT_SECONDS: ${WAVENODE_UPDATE_TIMEOUT_SECONDS:-900}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/compose/docker-compose.yml:ro
      - ./.env:/compose/.env:ro
    working_dir: /compose

volumes:
  database_data:
  artwork_data:
